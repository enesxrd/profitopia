<style>
:root{color-scheme:dark;--bg:#172130;--card:#223046;--card2:#2C3D58;--line:#3E5276;--sh:#0F1826;--tx:#F0F4FB;--mut:#9DB0CE;--gold:#FFC857;--ok:#5ED6A2;--bad:#FF7F88;--trk:#37496A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
